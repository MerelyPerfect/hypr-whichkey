# hypr-whichkey driver for hyprland.conf
# Add to hyprland.conf:   source = ~/.config/hypr-whichkey/whichkey.conf
# All binds are non-consuming (n) so your own SUPER shortcuts keep working.

$wk = ~/.local/bin/hypr-whichkey

bindn  = ,            Super_L,   exec, $wk 64
bindn  = SUPER,       Shift_L,   exec, $wk 65
bindn  = SUPER,       Control_L, exec, $wk 68
bindn  = SUPER,       Alt_L,     exec, $wk 72
bindn  = SUPER SHIFT, Control_L, exec, $wk 69
bindn  = SUPER SHIFT, Alt_L,     exec, $wk 73
bindn  = SUPER CTRL,  Shift_L,   exec, $wk 69
bindn  = SUPER ALT,   Shift_L,   exec, $wk 73

# releasing a secondary modifier goes back to plain SUPER
bindrn = SUPER SHIFT, Shift_L,   exec, $wk 64
bindrn = SUPER CTRL,  Control_L, exec, $wk 64
bindrn = SUPER ALT,   Alt_L,     exec, $wk 64

# releasing SUPER hides it (both masks: Hyprland may report SUPER already released)
bindrn = SUPER,       Super_L,   exec, $wk 0
bindrn = ,            Super_L,   exec, $wk 0

